formula_notation: "Terms ending in xr apply 5-response; all other terms use the raw response, including an item ID that itself ends in x."
source_anomaly:
  status: unresolved_requires_owner_decision
  detail: "The source marks both iu3x and iu4x for reversal, but its published formulas use raw iu3x in Intentional and raw iu4x in Alive while reversing the other item in each formula."
  implementation: exact_published_formula
