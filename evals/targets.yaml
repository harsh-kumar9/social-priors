    checked_at: "2026-07-30"
    requires_user_approval_for_live_calls: true
    generate_config:
      temperature: 0
    catalog:
      checked_endpoint: https://openrouter.ai/api/v1/models/openai/gpt-4o/endpoints
  strongreject-gpt4omini-official:
