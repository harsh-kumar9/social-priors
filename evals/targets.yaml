      checked_endpoint: https://openrouter.ai/api/v1/models/anthropic/claude-3.7-sonnet/endpoints
      endpoint_count: 0
  em-gpt4o-official:
    provider: openrouter
    model: openai/gpt-4o-2024-08-06
    inspect_model: openrouter/openai/gpt-4o-2024-08-06
