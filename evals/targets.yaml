schema_version: demand-worlds.targets.v1
catalog_snapshot:
  provider: openrouter
  checked_at: "2026-07-29"
  units: "USD per token, as returned by GET /api/v1/models"
downstream_selection:
  target_id: qwen35-27b-base
  model: qwen/qwen3.5-27b
  selected_at: "2026-07-29"
  scope: "All later suite development, dress rehearsal, and SDF evaluation targets."
  rationale: "Harsh selected 27B after the paired feasibility pilots; the sizes looked similar enough that a single more capable target is operationally preferable."
  excludes: "Historical 9B feasibility artifacts remain valid provenance and are not deleted."
future_role_policy:
  high_quality_authoring:
    model_class: frontier
    required_parameters: [author_model, author_provider]
    concrete_model: null
    instruction: "Select and record a frontier model before each authoring batch; do not silently fall back to Qwen."
  independent_critique:
    model_class: frontier
    required_parameters: [critic_model, critic_provider]
    concrete_model: null
    instruction: "Use a separate condition-blind frontier critique call and record exact provenance."
  intervention_and_pipeline_testing:
    target_id: qwen35-27b-base
    model: qwen/qwen3.5-27b
    instruction: "Use Qwen for base-readiness pilots, intervention tests, prompt dummies, and pipeline integration."
  authored_scale_judging:
    required_parameters:
      - judge_model
      - judge_base_url
      - judge_api_key_env
      - judge_instructions
    concrete_model: null
    instruction: "No model is hard-coded. Freeze the supplied judge identity and instructions before labels are viewed; calibration and formal agreement gates are judge-specific."
authors:
  belief-quartet-sonnet5-fresh-binary-generation:
    provider: openrouter
    model: anthropic/claude-sonnet-5
    role: eval_author_generation
    scope: fresh_binary_belief_quartet_generation
    approved_by_harsh: "2026-07-30"
    decoding:
      sampling: provider_fixed
      max_tokens: 24000
      reasoning_effort: medium
      structured_outputs: true
    provider_routing: {only: [Anthropic], require_parameters: true}
    cost_cap_usd_per_world: 0.50
    method_source: "git:safety-research/false-facts@4d6e6c4807fc07816f3d29a7f336c944bd8f31df"
    protocol: evals/pilots/p2_belief_quartet_frontier/PILOT_PROTOCOL.yaml
    catalog:
      checked_at: "2026-07-30"
      context_length: 1000000
      prompt_price_per_token: 0.000002
      completion_price_per_token: 0.00001
      max_completion_tokens: 128000
      supports:
        - reasoning
        - max_tokens
        - response_format
        - structured_outputs
        - reasoning_effort
  belief-quartet-terra-fresh-binary-critique:
    provider: openrouter
    model: openai/gpt-5.6-terra
    role: eval_author_critique
    scope: fresh_binary_belief_quartet_independent_defect_only_revision
    approved_by_harsh: "2026-07-30"
    decoding:
      sampling: provider_fixed
      seeds: {P: 20261101, S: 20261102, N: 20261103, A: 20261104}
      max_completion_tokens: 36000
      reasoning_effort: medium
      structured_outputs: true
    provider_routing: {only: [Azure], require_parameters: true}
    cost_cap_usd_per_world: 0.70
    protocol: evals/pilots/p2_belief_quartet_frontier/PILOT_PROTOCOL.yaml
    catalog:
      checked_at: "2026-07-30"
      context_length: 1050000
      prompt_price_per_token: 0.0000025
      completion_price_per_token: 0.000015
      max_completion_tokens: 128000
      supports:
        - max_completion_tokens
        - reasoning
        - response_format
        - seed
        - structured_outputs
        - reasoning_effort
  belief-quartet-qwen35-27b-generation:
    provider: openrouter
    model: qwen/qwen3.5-27b
    role: eval_author_generation
    scope: belief_quartet_generation
    approved_by_harsh: "2026-07-30"
    decoding:
      temperature: 0.8
      top_p: 0.95
      seeds: {P: 20260801, S: 20260802, N: 20260803, A: 20260804}
      max_tokens: 16000
      reasoning_enabled: false
      structured_outputs: true
    provider_routing: {only: [DeepInfra], require_parameters: true}
    cost_cap_usd_per_world: 0.50
    method_source: "git:safety-research/false-facts@4d6e6c4807fc07816f3d29a7f336c944bd8f31df"
    routing_note: "Alibaba accepted the structured-output parameter but returned an unenforced alternate schema on the first P attempt; DeepInfra was selected from the live healthy endpoints advertising structured_outputs."
  belief-quartet-qwen35-27b-critique:
    provider: openrouter
    model: qwen/qwen3.5-27b
    role: eval_author_critique
    scope: belief_quartet_independent_item_review_and_defect_only_revision
    approved_by_harsh: "2026-07-30"
    decoding:
      temperature: 0
      top_p: 1.0
      seeds: {P: 20260901, S: 20260902, N: 20260903, A: 20260904}
      max_tokens: 24000
      reasoning_enabled: false
      structured_outputs: true
    provider_routing: {only: [DeepInfra], require_parameters: true}
    cost_cap_usd_per_world: 0.50
  belief-quartet-qwen35-27b-repair:
    provider: openrouter
    model: qwen/qwen3.5-27b
    role: eval_author_targeted_repair
    scope: belief_quartet_post_critique_deterministic_defect_repair
    approved_by_harsh: "2026-07-30"
    decoding:
      temperature: 0
      top_p: 1.0
      seeds: {P: 20261001, S: 20261002, N: 20261003, A: 20261004}
      max_tokens: 18000
      reasoning_enabled: false
      structured_outputs: true
    provider_routing: {only: [DeepInfra], require_parameters: true}
    cost_cap_usd_per_world: 0.50
  true-universe-critique-terra:
    provider: openrouter
    model: openai/gpt-5.6-terra
    role: eval_author_critique
    scope: one_temperature_zero_true_universe_critique
    approved_by_harsh: "2026-07-30"
    decoding:
      temperature: unsupported_provider_fixed
      top_p: unsupported_provider_fixed
      seed: 20260730
      max_completion_tokens: 6000
      reasoning_effort: medium
      structured_outputs: true
    provider_routing: {only: [Azure], require_parameters: true}
    protocol_deviation: "The current Terra and Sonnet 5 endpoints advertise neither temperature nor top_p. The critique uses provider-fixed sampling, supported seed control, and strict structured output; it must not be described as temperature 0."
    cost_cap_usd: 0.25
    catalog:
      checked_at: "2026-07-30"
      context_length: 1050000
      prompt_price_per_token: 0.00000125
      completion_price_per_token: 0.0000075
      input_cache_read_price_per_token: 0.000000125
      input_cache_write_price_per_token: 0.0000015625
      supports:
        - max_completion_tokens
        - max_tokens
        - reasoning
        - reasoning_effort
        - response_format
        - seed
        - structured_outputs
